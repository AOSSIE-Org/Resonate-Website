# Dependabot configuration for automated dependency management
# Automatically checks for outdated and vulnerable dependencies
# and raises pull requests with version upgrades

version: 2
updates:
  # NPM dependencies - check for updates weekly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Group updates to reduce PR volume
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
    # Pull request settings
    open-pull-requests-limit: 10
    reviewers:
      - "ShwetaKumari-programming"
    assignees:
      - "ShwetaKumari-programming"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Rebase strategy for conflicts
    rebase-strategy: "auto"
    # Security updates - check daily for vulnerabilities
    versioning-strategy: "increase"
    
  # GitHub Actions - keep workflow actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "ShwetaKumari-programming"
    labels:
      - "ci/cd"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"
